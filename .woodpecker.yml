pipeline:
  lint:
    image: codeberg.org/opencode/super-linter:latest
    environment:
      DEFAULT_BRANCH: main
      VALIDATE_ALL_CODEBASE: "false"
      LINTER_RULES_PATH: .github/linters
      PYTHON_BLACK_CONFIG_FILE: .python-black
      PYTHON_FLAKE8_CONFIG_FILE: .flake8
      PYTHON_ISORT_CONFIG_FILE: .isort.cfg
      MARKDOWN_CONFIG_FILE: .github/linters/.markdown-lint.yml
      JAVASCRIPT_STANDARD_CONFIG: .eslintrc.json
      FILTER_REGEX_EXCLUDE: ".*\\.html$"
    secrets: [GITHUB_TOKEN]
    when:
      - event: push
        branch: main
      - event: pull_request
        target: main

  test:
    image: ubuntu:latest
    depends_on: [lint]
    commands:
      - apt-get update -q
      - apt-get install -y sudo ffmpeg
      - echo "Tests passed - no test suite configured"
    when:
      - event: push
        branch: main
      - event: pull_request
        target: main
