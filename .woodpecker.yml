pipeline:
  lint-markdown:
    image: node:latest
    commands:
      - npm install -g markdownlint-cli
      - markdownlint --config .github/linters/.markdown-lint.yml "docs/**/*.md" || true

  lint-javascript:
    image: node:latest
    commands:
      - npm install -g eslint
      - eslint --config .eslintrc.json docs/js/ || true

  test:
    image: ubuntu:latest
    commands:
      - apt-get update -q
      - apt-get install -y ffmpeg
      - echo "Tests passed - no test suite configured"
    depends_on: [lint-markdown, lint-javascript]
