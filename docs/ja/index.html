  <script>
  (function(){
    var lang = (navigator.language || navigator.userLanguage || '').substring(0, 2);
    var path = window.location.pathname;
    if (path === '/' || path === '') {
      var map = { es:'es', pt:'pt', fr:'fr', sv:'sv', ja:'ja', ko:'ko', vi:'vi', ar:'ar' };
      var full = { 'zh-CN':'zh-CN', 'zh-TW':'zh-TW' };
      var fullLang = (navigator.language || navigator.userLanguage || '');
      if (full[fullLang]) window.location.replace('/' + full[fullLang] + '/');
      else if (map[lang] && lang !== 'en') window.location.replace('/' + map[lang] + '/');
    }
  })();
