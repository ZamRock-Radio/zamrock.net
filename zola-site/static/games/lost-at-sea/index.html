<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost at Sea v0.0.10</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0a0a1a;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
    }
    canvas {
      border: 3px solid #2a3a4a;
      border-radius: 8px;
      image-rendering: pixelated;
    }
    .ui {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #8b9dc3;
      font-size: 12px;
      background: rgba(10, 10, 26, 0.9);
      padding: 10px;
      border-radius: 5px;
    }
    .ui h3 { color: #daa520; margin-bottom: 5px; }
    .resource { margin: 3px 0; }
    .controls {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: #6a7a9a;
      font-size: 11px;
      background: rgba(10, 10, 26, 0.9);
      padding: 10px;
      border-radius: 5px;
    }
    .time {
      position: fixed;
      top: 10px;
      right: 10px;
      color: #daa520;
      font-size: 14px;
      background: rgba(10, 10, 26, 0.9);
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>
  
  <div class="ui">
    <h3>Lost at Sea v0.0.10</h3>
    <div class="resource">Food: <span id="food">10</span></div>
    <div class="resource">Water: <span id="water">10</span></div>
    <div class="resource">Wood: <span id="wood">0</span></div>
    <div class="resource">Fish: <span id="fish">0</span></div>
  </div>
  
  <div class="time">Day <span id="day">1</span> - <span id="timeOfDay">Morning</span></div>
  
  <div class="controls">
    Arrow Keys: Walk on boat | Space: Fish | R: Collect Rain
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const WATER_LINE = H * 0.55;

    let time = 0;
    let day = 1;
    let timeOfDay = 'Morning';
    let isRaining = false;
    let rainDrops = [];

    let resources = {
      food: 10,
      water: 10,
      wood: 0,
      fish: 0
    };

    const raft = {
      x: W / 2,
      baseY: WATER_LINE,
      width: 60,
      height: 6,
      targetX: W / 2,
      driftSpeed: 0.15,
      y: WATER_LINE,
      velocityY: 0,
      rotation: 0
    };

    const player = {
      x: W / 2,
      y: WATER_LINE - 15,
      width: 16,
      height: 24,
      vx: 0,
      facing: 1,
      isFishing: false,
      fishTimer: 0,
      isCollectingRain: false,
      collectTimer: 0,
      scarfPoints: [{x: 0, y: 0}, {x: 0, y: 0}, {x: 0, y: 0}],
      animFrame: 0
    };

    const waterWaves = [
      { amp: 20, freq: 0.006, speed: 0.8, phase: Math.random() * Math.PI * 2 },
      { amp: 12, freq: 0.015, speed: 1.2, phase: Math.random() * Math.PI * 2 },
      { amp: 6,  freq: 0.03,  speed: 1.6, phase: Math.random() * Math.PI * 2 },
      { amp: 3,  freq: 0.05,  speed: 2.2, phase: Math.random() * Math.PI * 2 }
    ];
    
    let globalTime = 0;

    const fish = [];
    for (let i = 0; i < 5; i++) {
      spawnFish();
    }

    const floatingDebris = [];
    for (let i = 0; i < 3; i++) {
      spawnDebris();
    }

    function spawnFish() {
      fish.push({
        x: Math.random() * W,
        y: WATER_LINE + 80 + Math.random() * 100,
        baseY: WATER_LINE + 80 + Math.random() * 100,
        size: 5 + Math.random() * 4,
        speed: 0.3 + Math.random() * 0.5,
        dir: Math.random() > 0.5 ? 1 : -1,
        wobble: Math.random() * Math.PI * 2
      });
    }

    function spawnDebris() {
      floatingDebris.push({
        x: Math.random() * W,
        y: WATER_LINE + 30 + Math.random() * 70,
        type: Math.random() > 0.5 ? 'wood' : 'bottle',
        rotation: Math.random() * Math.PI * 2,
        size: 6 + Math.random() * 6
      });
    }

    const keys = {};

    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && !player.isFishing) {
        player.isFishing = true;
        player.fishTimer = 60;
      }
      if (e.code === 'KeyR' && isRaining) {
        player.isCollectingRain = true;
      }
    });

    document.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'KeyR') {
        player.isCollectingRain = false;
      }
    });

    function getWaveHeightAt(x) {
      let height = 0;
      waterWaves.forEach(w => {
        height += Math.sin(x * w.freq + globalTime * w.speed + w.phase) * w.amp;
      });
      return height;
    }
    
    function getWaveSlopeAt(x) {
      let slope = 0;
      waterWaves.forEach(w => {
        slope += Math.cos(x * w.freq + globalTime * w.speed + w.phase) * w.amp * w.freq;
      });
      return slope;
    }

    function updateRaft() {
      if (Math.random() < 0.002) {
        raft.targetX = 150 + Math.random() * (W - 300);
      }

      raft.x += (raft.targetX - raft.x) * 0.003;

      const targetY = WATER_LINE + getWaveHeightAt(raft.x) + 4;
      const targetRotation = Math.atan(getWaveSlopeAt(raft.x)) * 0.5;
      
      const springForce = (targetY - raft.y) * 0.15;
      raft.velocityY += springForce;
      raft.velocityY *= 0.92;
      raft.y += raft.velocityY;
      
      raft.rotation += (targetRotation - raft.rotation) * 0.15;
    }

    function updatePlayer() {
      if (player.isFishing) {
        player.fishTimer--;
        if (player.fishTimer <= 0) {
          player.isFishing = false;
          if (Math.random() < 0.35) {
            resources.fish += 1;
            resources.food += 2;
          }
        }
      }

      if (player.isCollectingRain && isRaining) {
        player.collectTimer++;
        if (player.collectTimer >= 90) {
          resources.water += 1;
          player.collectTimer = 0;
        }
      }

      if (keys['ArrowLeft']) {
        player.vx = -1.5;
        player.facing = -1;
      } else if (keys['ArrowRight']) {
        player.vx = 1.5;
        player.facing = 1;
      } else {
        player.vx *= 0.8;
      }

      player.x += player.vx;

      const raftLeft = raft.x - raft.width / 2 + 8;
      const raftRight = raft.x + raft.width / 2 - 8;
      player.x = Math.max(raftLeft, Math.min(raftRight, player.x));

      const waveAtPlayer = getWaveHeightAt(player.x);
      player.y = raft.y - 14;

      if (Math.abs(player.vx) > 0.3) {
        player.animFrame += 0.08;
      }
    }

    function updateWater() {
      globalTime += 0.016;
    }

    function updateFish() {
      fish.forEach(f => {
        f.x += f.speed * f.dir;
        f.wobble += 0.08;
        f.baseY = WATER_LINE + getWaveHeightAt(f.x) + 60 + Math.sin(f.wobble) * 15;
        
        if (f.x < -30) f.x = W + 30;
        if (f.x > W + 30) f.x = -30;
      });
    }

    function updateDebris() {
      floatingDebris.forEach(d => {
        d.x += 0.1;
        d.rotation += 0.005;
        if (d.x > W + 50) {
          d.x = -50;
        }
        d.y = WATER_LINE + getWaveHeightAt(d.x) + 25;
      });
    }

    function updateWeather() {
      if (Math.random() < 0.001) {
        isRaining = !isRaining;
      }

      if (isRaining) {
        if (Math.random() < 0.15) {
          rainDrops.push({
            x: Math.random() * W,
            y: -10,
            speed: 4 + Math.random() * 2
          });
        }
        rainDrops.forEach(r => {
          r.y += r.speed;
        });
        rainDrops = rainDrops.filter(r => r.y < H);
      } else {
        rainDrops = [];
      }
    }

    function updateTime() {
      time++;
      
      if (time % 180 === 0) {
        resources.food -= 0.1;
        resources.water -= 0.15;
        
        if (resources.food < 0) resources.food = 0;
        if (resources.water < 0) resources.water = 0;
      }

      const hour = Math.floor((time % 5400) / 225);
      if (hour >= 6 && hour < 12) timeOfDay = 'Morning';
      else if (hour >= 12 && hour < 18) timeOfDay = 'Afternoon';
      else if (hour >= 18 && hour < 20) timeOfDay = 'Evening';
      else timeOfDay = 'Night';

      if (time % 5400 === 0) day++;
    }

    function getSkyColor() {
      if (timeOfDay === 'Morning') return '#ff9966';
      if (timeOfDay === 'Afternoon') return '#87ceeb';
      if (timeOfDay === 'Evening') return '#ff6b4a';
      return '#1a1a3a';
    }

    function drawSky() {
      const gradient = ctx.createLinearGradient(0, 0, 0, WATER_LINE);
      const baseColor = getSkyColor();
      gradient.addColorStop(0, baseColor);
      gradient.addColorStop(1, '#4a7a9a');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, WATER_LINE);
    }

    function drawSunMoon() {
      const progress = (time % 5400) / 5400;
      const sunX = 100 + progress * (W - 200);
      const sunY = WATER_LINE - 40 - Math.sin(progress * Math.PI) * 50;
      
      if (timeOfDay === 'Night') {
        ctx.fillStyle = '#f0f0ff';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 10, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#ffdd44';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 12, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawWater() {
      const gradient = ctx.createLinearGradient(0, WATER_LINE, 0, H);
      gradient.addColorStop(0, '#2a7090');
      gradient.addColorStop(0.3, '#1a5070');
      gradient.addColorStop(1, '#0a3050');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.moveTo(0, WATER_LINE);
      
      for (let x = 0; x <= W; x += 3) {
        let y = WATER_LINE + getWaveHeightAt(x);
        ctx.lineTo(x, y);
      }
      
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(60, 140, 180, 0.4)';
      ctx.beginPath();
      ctx.moveTo(0, WATER_LINE + 8);
      
      for (let x = 0; x <= W; x += 3) {
        let y = WATER_LINE + 8 + getWaveHeightAt(x) * 0.9;
        ctx.lineTo(x, y);
      }
      
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, WATER_LINE + getWaveHeightAt(0));
      for (let x = 3; x <= W; x += 3) {
        ctx.lineTo(x, WATER_LINE + getWaveHeightAt(x));
      }
      ctx.stroke();

      ctx.strokeStyle = 'rgba(200, 240, 255, 0.3)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 8; i++) {
        const startX = (i * 130 + globalTime * 30) % (W + 100) - 50;
        ctx.beginPath();
        ctx.moveTo(startX, WATER_LINE + 5);
        ctx.quadraticCurveTo(
          startX + 40, WATER_LINE - 8,
          startX + 80, WATER_LINE + 5
        );
        ctx.stroke();
      }
    }

    function drawRain() {
      if (!isRaining) return;
      
      ctx.strokeStyle = 'rgba(150, 200, 255, 0.4)';
      ctx.lineWidth = 1;
      rainDrops.forEach(r => {
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x - 1, r.y + 8);
        ctx.stroke();
      });
    }

    function drawRaftAndPlayer() {
      ctx.save();
      ctx.translate(raft.x, raft.y + raft.height / 2);
      ctx.rotate(raft.rotation);
      
      ctx.fillStyle = '#7a4a2a';
      ctx.fillRect(-raft.width / 2, -raft.height / 2, raft.width, raft.height);
      
      ctx.fillStyle = '#5a3015';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(-raft.width / 2 + 8 + i * 18, -raft.height / 2, 3, raft.height);
      }
      
      ctx.fillStyle = '#8a5a3a';
      ctx.fillRect(-raft.width / 2 - 3, -raft.height / 2 - 4, 8, 4);
      ctx.fillRect(raft.width / 2 - 5, -raft.height / 2 - 4, 8, 4);
      
      const playerLocalX = player.x - raft.x;
      const playerLocalY = player.y - (raft.y + raft.height / 2) - player.height / 2;
      const px = playerLocalX - player.width / 2;
      const py = playerLocalY;
      const facing = player.facing;
      
      ctx.save();
      if (facing === -1) {
        ctx.translate(px + player.width, py);
        ctx.scale(-1, 1);
        ctx.translate(-px, -py);
      }

      ctx.fillStyle = '#4a3020';
      ctx.fillRect(px, py, 16, 5);
      
      ctx.fillStyle = '#60a0e0';
      ctx.fillRect(px + 2, py + 6, 12, 4);
      
      ctx.fillStyle = '#e8c4a0';
      ctx.fillRect(px + 2, py + 4, 12, 10);
      
      ctx.fillStyle = '#fff';
      ctx.fillRect(px + 4, py + 6, 3, 3);
      ctx.fillRect(px + 9, py + 6, 3, 3);
      ctx.fillStyle = '#333';
      ctx.fillRect(px + 5, py + 7, 2, 2);
      ctx.fillRect(px + 10, py + 7, 2, 2);
      
      ctx.fillStyle = '#c9a07a';
      ctx.fillRect(px + 2, py + 14, 12, 6);
      
      const legOffset = Math.sin(player.animFrame) * 1.5;
      ctx.fillStyle = '#c9a07a';
      ctx.fillRect(px + 3, py + 19, 4, 4 + legOffset);
      ctx.fillRect(px + 9, py + 19, 4, 4 - legOffset);

      const scarfColor = '#cc3333';
      const neckY = py + 12;
      const neckLeft = px + 2;
      const neckRight = px + 14;

      player.scarfPoints.length = 9;
      for (let i = 0; i < player.scarfPoints.length; i++) {
        if (!player.scarfPoints[i]) player.scarfPoints[i] = {x: neckRight, y: neckY};
      }

      const sp = player.scarfPoints;
      for (let i = sp.length - 1; i >= 1; i--) {
        sp[i].x += (sp[i-1].x - sp[i].x) * 0.25;
        sp[i].y += (sp[i-1].y - sp[i].y) * 0.25;
      }
      sp[0].x = neckRight + Math.sin(globalTime * 3) * 1.5;
      sp[0].y = neckY + 2 + Math.cos(globalTime * 2.5) * 1;
      
      ctx.strokeStyle = scarfColor;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(neckRight, neckY + 1);
      ctx.lineTo(sp[0].x, sp[0].y);
      for (let i = 1; i < sp.length; i++) {
        ctx.lineTo(sp[i].x, sp[i].y);
      }
      ctx.stroke();

      if (player.isFishing) {
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + 8, py - 15);
        ctx.stroke();
        
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath();
        ctx.arc(px + 8, py - 17, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      if (player.isCollectingRain) {
        ctx.fillStyle = '#555';
        ctx.fillRect(px - 5, py - 8, 10, 4);
        ctx.fillStyle = '#777';
        ctx.fillRect(px - 3, py - 4, 6, 2);
      }
      
      ctx.restore();
      ctx.restore();
    }

    function drawFish() {
      fish.forEach(f => {
        const wobbleY = Math.sin(f.wobble) * 1.5;
        
        ctx.fillStyle = '#ffa500';
        ctx.beginPath();
        ctx.ellipse(f.x, f.baseY + wobbleY, f.size, f.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(f.x - f.size * 0.3 * f.dir, f.baseY + wobbleY - 1, 1, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#ff8800';
        ctx.beginPath();
        ctx.moveTo(f.x + f.size * f.dir, f.baseY + wobbleY);
        ctx.lineTo(f.x + f.size * 1.1 * f.dir, f.baseY - 2 + wobbleY);
        ctx.lineTo(f.x + f.size * 1.1 * f.dir, f.baseY + 2 + wobbleY);
        ctx.closePath();
        ctx.fill();
      });
    }

    function drawDebris() {
      floatingDebris.forEach(d => {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rotation);
        
        if (d.type === 'wood') {
          ctx.fillStyle = '#8B4513';
          ctx.fillRect(-d.size / 2, -2, d.size, 4);
        } else {
          ctx.fillStyle = '#3a8a9a';
          ctx.beginPath();
          ctx.ellipse(0, 0, d.size / 2, d.size / 3, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        
        ctx.restore();
      });
    }

    function drawUI() {
      document.getElementById('food').textContent = Math.floor(resources.food);
      document.getElementById('water').textContent = Math.floor(resources.water);
      document.getElementById('wood').textContent = Math.floor(resources.wood);
      document.getElementById('fish').textContent = Math.floor(resources.fish);
      document.getElementById('day').textContent = day;
      document.getElementById('timeOfDay').textContent = timeOfDay;
    }

    function update() {
      updateTime();
      updateWeather();
      updateWater();
      updateRaft();
      updatePlayer();
      updateFish();
      updateDebris();
      drawUI();
    }

    function draw() {
      drawSky();
      drawSunMoon();
      drawWater();
      drawRain();
      drawDebris();
      drawFish();
      drawRaftAndPlayer();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
