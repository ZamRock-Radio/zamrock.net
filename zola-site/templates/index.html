{% extends "base.html" %}

{% block content %}
<div class="player-container">
  <button id="play-btn" class="play-btn">
    <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
    <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
    <span id="play-label">Listen Live</span>
  </button>
  <audio id="radio-audio" preload="none"></audio>
</div>

<section class="news-section">
  <h2>{{ i18n::t(key="news_title") }}</h2>
  <div id="newsContainer" class="news-grid">
    <div class="loading">{{ i18n::t(key="news_loading") }}</div>
  </div>
</section>
<div class="view-more">
  <a href="news/" class="btn">{{ i18n::t(key="news_view_all") }}</a>
</div>
{% endblock content %}

{% block scripts %}
<script src="{{ get_url(path="js/main.js", trailing_slash=false) }}"></script>
<script src="{{ get_url(path="js/news.js", trailing_slash=false) }}"></script>
{% endblock scripts %}
