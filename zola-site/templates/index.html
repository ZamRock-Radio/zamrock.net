{% extends "base.html" %}

{% block content %}
<section class="news-section">
  <h2>{{ trans(key="news_title") }}</h2>
  <div id="newsContainer" class="news-grid">
    <div class="loading">{{ trans(key="news_loading") }}</div>
  </div>
</section>
<div class="view-more">
  <a href="{{ get_url(path="news/") }}" class="btn">{{ trans(key="news_view_all") }}</a>
</div>
{% endblock content %}

{% block scripts %}
<script src="{{ get_url(path="js/news.js", trailing_slash=false) }}"></script>
{% endblock scripts %}
